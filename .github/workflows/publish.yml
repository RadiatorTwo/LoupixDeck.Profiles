name: Publish index

# Rebuilds index.json after a submission is merged and commits it back to master.

on:
  push:
    branches: [ master ]
    paths:
      - 'profiles/**'
      - 'scripts/build_index.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-index
  cancel-in-progress: false

jobs:
  publish:
    name: Build and commit index.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build index
        run: python scripts/build_index.py

      - name: Validate index against schema
        run: |
          pip install --quiet check-jsonschema
          check-jsonschema --schemafile index.schema.json index.json

      - name: Commit index.json
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "Update index.json"
          git push
